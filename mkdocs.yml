# =========================================================================
# TSDynamics documentation
# =========================================================================
# The published site: brand wiring plus the nine-tab information architecture
# (Home / Start / Analysis / Systems / Visualization / Tutorials / Theory /
# References / Project).  The Systems tree is build-generated by
# hooks/docs_autogen.py; everything else is a physical page under docs/.
#
# Every page under docs/ is PUBLISHED unless it is named in `exclude_docs`
# below — see the note there.  Do not reintroduce a whole-tree exclusion.
#
# Local preview:    .venv/bin/mkdocs serve
# Production build: .venv/bin/mkdocs build
# =========================================================================

site_name: TSDynamics
site_description: >-
  177 built-in dynamical systems, compiled integration, and a chaos-analysis
  toolkit for Python
site_url: https://el3ssar.github.io/TSDynamics/
site_author: Daniel Estevez

repo_name: El3ssar/TSDynamics
repo_url: https://github.com/El3ssar/TSDynamics
edit_uri: edit/main/docs/
copyright: >-
  Copyright &copy; 2024–2026 Daniel Estevez — MIT License

docs_dir: docs

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/brand/logo/icon-on-dark.svg
  favicon: assets/brand/logo/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/El3ssar/TSDynamics
      name: TSDynamics on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/tsdynamics/
      name: TSDynamics on PyPI

extra_css:
  - assets/brand/tokens.css
  - assets/brand/mkdocs/extra.css
  - assets/brand/mkdocs/figure-rail.css
  - assets/brand/mkdocs/systems.css
  # GitHub-dark syntax highlighting for fenced code blocks — loaded AFTER
  # extra.css so it is the final word on code-block token colours.
  - assets/brand/mkdocs/code-github-dark.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css

extra_javascript:
  - js/math.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js

plugins:
  - search
  - glightbox:
      effect: zoom
      zoomable: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://docs.scipy.org/doc/scipy/objects.inv
          options:
            docstring_style: numpy
            docstring_section_style: spacy
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            signature_crossrefs: true
            separate_signature: true
            merge_init_into_class: true
            show_source: true
            show_bases: true
            members_order: source
            heading_level: 2
            filters:
              - "!^_"
              - "^__init__$"

# Build-time generator: the per-system + browser pages for the Systems tree,
# emitted as virtual files and patched into the nav (see hooks/docs_autogen.py).
hooks:
  - hooks/docs_autogen.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.betterem
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: El3ssar
      repo: TSDynamics

nav:
  - Home: index.md
  - Start:
      - start/index.md
      - "Install": start/install.md
      - "First trajectory": start/first-trajectory.md
      - "The mental model": start/concepts.md
      - "Defining a system": start/defining-systems.md
  - Analysis:
      - analysis/index.md
      - "Integration & methods": analysis/integration-and-methods.md
      - "Lyapunov": analysis/lyapunov.md
      - "Orbit & bifurcation": analysis/orbit-diagrams.md
      - "Poincaré sections": analysis/poincare.md
      - "Fixed & periodic points": analysis/fixed-points.md
      - "Chaos indicators": analysis/chaos.md
      - "Recurrence & RQA": analysis/recurrence.md
      - "Fractal dimensions": analysis/dimensions.md
      - "Delay embeddings": analysis/embedding.md
      - "Attractors & basins": analysis/basins.md
  - Systems:
      - systems/index.md
  - Visualization:
      - visualization/index.md
      - "The gallery": visualization/gallery.md
      - "Plotting & kinds": visualization/plotting.md
      - "Conventions": visualization/conventions.md
      - "Styling & themes": visualization/styling.md
      - "Animation": visualization/animation.md
      - "Composition": visualization/composition.md
      - "Space-filling curves": visualization/hilbert.md
      - "Backends & export": visualization/backends.md
  - Tutorials:
      - tutorials/index.md
      - "From equations to a chaotic attractor": tutorials/chaotic-attractor.md
      - "The road to chaos — bifurcations": tutorials/bifurcations.md
      - "Reconstructing dynamics from a signal": tutorials/reconstruction.md
      - "Basins & multistability": tutorials/basins-multistability.md
      - "Poincaré & return maps": tutorials/poincare-return-maps.md
      - "Noise-driven dynamics": tutorials/noise-driven.md
  - Theory:
      - theory/index.md
      - "Compilation pipeline": theory/compilation.md
      - "Solvers": theory/solvers.md
      - "Backends": theory/backends.md
      - "Lyapunov exponents": theory/lyapunov.md
      - "Rigorous fixed points": theory/fixed-points-interval.md
      - "Conventions": theory/conventions.md
      - "Packaging": theory/packaging.md
  - References:
      - references/index.md
      - "Benchmarks": references/benchmarks.md
      - "Bibliography": references/bibliography.md
      - "API reference":
          - reference/index.md
          - "Top level": reference/top-level.md
          - "Base classes": reference/base.md
          - "Derived systems": reference/derived.md
          - "Analysis": reference/analysis.md
          - "Data & state-space": reference/data.md
          - "Solvers": reference/solvers.md
          - "Registry": reference/registry.md
          - "Utilities": reference/utils.md
  - Project:
      - project/index.md
      - "Citation": project/citation.md
      - "Contributing": project/contributing.md
      - "Changelog": project/changelog.md
      - "Adding a system": project/adding-a-system.md
      - "Adding a solver": project/adding-a-solver.md
      - "Naming glossary": contributing/glossary.md

# Every page under docs/ is published EXCEPT the few named here.
#
# This list is deliberately short and enumerated file-by-file: there is no
# blanket tree-drop.  A whole-tree pattern (``theory/``) is how 1.2k lines of
# accurate, *linked-to* documentation silently fell out of the site — including
# pages a shipping source docstring points at
# (``analysis/fixedpoints/_interval.py`` → ``theory/fixed-points-interval.md``).
# Publishing-by-default means a new page has to be *taken out* on purpose.
# tests/test_doctests.py::test_doc_exclusions_are_exactly_the_reviewed_set and
# ::test_no_blanket_tree_exclusions_over_content fail if this list grows.
exclude_docs: |
  # Tooling and non-page assets — never rendered as documentation.
  _tooling/
  _static/
  css/
  hero-preview.html
  # The Systems tree is build-generated: hooks/docs_autogen.py emits the
  # systems/<family>/ IA (ode / dde / sde / maps) as virtual files plus a fresh
  # systems/index.md.  These three physical stubs are the pre-generation
  # originals and would collide with the generated pages, so they alone are
  # dropped.  They are the ONLY content pages excluded from the site.
  systems/continuous/index.md
  systems/delay/index.md
  systems/discrete/index.md

validation:
  omitted_files: ignore
  absolute_links: ignore
  # A broken internal link is a build failure under --strict.  This was
  # ``ignore``, which is how ``theory/`` accumulated links to
  # ``analysis/integrate.md`` and ``systems/delay/index.md`` — two pages that
  # had been renamed out from under them — without the build ever complaining.
  unrecognized_links: warn
