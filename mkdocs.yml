# =========================================================================
# TSDynamics documentation
# =========================================================================
# Phase-0 scaffold of the site rebuild: brand wiring + the new 8-tab
# information architecture. Each top-level tab points at its own index.md
# for now; the real per-section content (and the per-system generator) is
# rebuilt in later phases.
#
# Local preview:    .venv/bin/mkdocs serve
# Production build: .venv/bin/mkdocs build
# =========================================================================

site_name: TSDynamics
site_description: >-
  171 built-in dynamical systems, compiled integration, and a chaos-analysis
  toolkit for Python
site_url: https://el3ssar.github.io/TSDynamics/
site_author: Daniel Estevez

repo_name: El3ssar/TSDynamics
repo_url: https://github.com/El3ssar/TSDynamics
edit_uri: edit/main/docs/
copyright: >-
  Copyright &copy; 2024–2026 Daniel Estevez — MIT License

docs_dir: docs

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/brand/logo/icon-on-dark.svg
  favicon: assets/brand/logo/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/El3ssar/TSDynamics
      name: TSDynamics on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/tsdynamics/
      name: TSDynamics on PyPI

extra_css:
  - assets/brand/tokens.css
  - assets/brand/mkdocs/extra.css
  - assets/brand/mkdocs/figure-rail.css
  - assets/brand/mkdocs/systems.css
  # GitHub-dark syntax highlighting for fenced code blocks — loaded AFTER
  # extra.css so it is the final word on code-block token colours.
  - assets/brand/mkdocs/code-github-dark.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css

extra_javascript:
  - js/math.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js

plugins:
  - search
  - glightbox:
      effect: zoom
      zoomable: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://docs.scipy.org/doc/scipy/objects.inv
          options:
            docstring_style: numpy
            docstring_section_style: spacy
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            signature_crossrefs: true
            separate_signature: true
            merge_init_into_class: true
            show_source: true
            show_bases: true
            members_order: source
            heading_level: 2
            filters:
              - "!^_"
              - "^__init__$"

# Build-time generator: the per-system + browser pages for the Systems tree,
# emitted as virtual files and patched into the nav (see hooks/docs_autogen.py).
hooks:
  - hooks/docs_autogen.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.betterem
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: El3ssar
      repo: TSDynamics

nav:
  - Home: index.md
  - Start:
      - start/index.md
      - "Install": start/install.md
      - "First trajectory": start/first-trajectory.md
      - "The mental model": start/concepts.md
      - "Defining a system": start/defining-systems.md
  - Analysis:
      - analysis/index.md
      - "Integration & methods": analysis/integration-and-methods.md
      - "Lyapunov": analysis/lyapunov.md
      - "Orbit & bifurcation": analysis/orbit-diagrams.md
      - "Poincaré sections": analysis/poincare.md
      - "Fixed & periodic points": analysis/fixed-points.md
      - "Chaos indicators": analysis/chaos.md
      - "Recurrence & RQA": analysis/recurrence.md
      - "Fractal dimensions": analysis/dimensions.md
      - "Delay embeddings": analysis/embedding.md
      - "Entropy & complexity": analysis/entropy.md
      - "Surrogates": analysis/surrogate.md
      - "Attractors & basins": analysis/basins.md
  - Systems:
      - systems/index.md
  - Visualization:
      - visualization/index.md
      - "Plotting & kinds": visualization/plotting.md
      - "Conventions": visualization/conventions.md
      - "Styling & themes": visualization/styling.md
      - "Animation": visualization/animation.md
      - "Composition": visualization/composition.md
      - "Backends & export": visualization/backends.md
  - Tutorials:
      - tutorials/index.md
      - "From equations to a chaotic attractor": tutorials/chaotic-attractor.md
      - "The road to chaos — bifurcations": tutorials/bifurcations.md
      - "Reconstructing dynamics from a signal": tutorials/reconstruction.md
      - "Basins & multistability": tutorials/basins-multistability.md
      - "Poincaré & return maps": tutorials/poincare-return-maps.md
      - "Noise-driven dynamics": tutorials/noise-driven.md
  - References:
      - references/index.md
      - "Benchmarks": references/benchmarks.md
      - "Bibliography": references/bibliography.md
      - "API reference":
          - reference/index.md
          - "Top level": reference/top-level.md
          - "Base classes": reference/base.md
          - "Derived systems": reference/derived.md
          - "Analysis": reference/analysis.md
          - "Transforms": reference/transforms.md
          - "Data & state-space": reference/data.md
          - "Solvers": reference/solvers.md
          - "Registry": reference/registry.md
          - "Utilities": reference/utils.md
  - Project:
      - project/index.md
      - "Citation": project/citation.md
      - "Contributing": project/contributing.md
      - "Changelog": project/changelog.md
      - "Adding a system": project/adding-a-system.md
      - "Adding a solver": project/adding-a-solver.md

exclude_docs: |
  # tooling / non-page assets
  _tooling/
  _static/
  css/
  hero-preview.html
  # old content trees dropped from the new IA (rebuilt in later phases)
  theory/
  transforms/
  contributing/
  # Phase 0 ships only the per-section index stubs; the old in-section
  # content pages are off-nav and rebuilt section by section in Phase 2.
  start/*.md
  !start/index.md
  !start/install.md
  !start/first-trajectory.md
  !start/concepts.md
  !start/defining-systems.md
  analysis/*.md
  !analysis/index.md
  !analysis/integration-and-methods.md
  !analysis/lyapunov.md
  !analysis/orbit-diagrams.md
  !analysis/poincare.md
  !analysis/fixed-points.md
  !analysis/chaos.md
  !analysis/recurrence.md
  !analysis/dimensions.md
  !analysis/embedding.md
  !analysis/entropy.md
  !analysis/surrogate.md
  !analysis/basins.md
  # The Systems tree is build-generated (hooks/docs_autogen.py emits the new
  # systems/<type>/<subcat>/ IA as virtual files + a fresh systems/index.md).
  # Only the dropped old physical stubs are excluded; the generated pages pass.
  systems/continuous/
  systems/delay/
  systems/discrete/
  visualization/*.md
  !visualization/index.md
  !visualization/plotting.md
  !visualization/conventions.md
  !visualization/styling.md
  !visualization/animation.md
  !visualization/composition.md
  !visualization/backends.md
  tutorials/*.md
  !tutorials/index.md
  !tutorials/chaotic-attractor.md
  !tutorials/bifurcations.md
  !tutorials/reconstruction.md
  !tutorials/basins-multistability.md
  !tutorials/poincare-return-maps.md
  !tutorials/noise-driven.md
  project/*.md
  !project/index.md
  !project/citation.md
  !project/contributing.md
  !project/changelog.md
  !project/adding-a-system.md
  !project/adding-a-solver.md

validation:
  omitted_files: ignore
  absolute_links: ignore
  unrecognized_links: ignore
