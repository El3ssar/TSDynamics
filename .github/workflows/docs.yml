# Documentation: build on every PR and push to main (validation),
# deploy to GitHub Pages only on push to main.
#
# Catalogue figures, interactive viewers, the plot gallery and spatial-field
# movies are generated at build time. Content keys track numerical and drawing
# sources, so changes to inherited equations or renderers invalidate old output.

name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Only validate docs when something doc-relevant changes; an out-of-scope PR
    # would otherwise recompile the Rust engine (uv sync + maturin) for nothing.
    # The push-to-main trigger above stays unscoped so deploys always run.
    paths:
      - "docs/**"
      - "src/tsdynamics/**"
      - "mkdocs.yml"
      - "hooks/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "CLAUDE.md"
      - ".github/workflows/docs.yml"
      - ".github/scripts/install_ffmpeg.py"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # Silence Material for MkDocs' unconditional "MkDocs 2.0" marketing banner
  # (env-var suppression added in mkdocs-material 9.7.2).
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # The docs import `tsdynamics` (autogen pages, figures), so the build needs
      # the compiled engine; `uv sync` builds it via maturin (needs Rust).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-02
        with:
          toolchain: stable

      # The spatial-field systems (Gray-Scott / Swift-Hohenberg) render an animated
      # field-movie hero (docs/_tooling/field_movies.py) as an H.264 mp4 via
      # matplotlib's ffmpeg writer. Use a pinned binary wheel rather than waiting
      # on apt mirror failover; the isolated tool does not change project deps.
      - name: Install ffmpeg (field-movie encoder)
        timeout-minutes: 3
        env:
          UV_HTTP_TIMEOUT: "30"
          UV_HTTP_RETRIES: "2"
        run: uv run --no-project --python 3.12 --no-build .github/scripts/install_ffmpeg.py

      # Persist every generated illustration family. Include runtime inputs in
      # the outer key as well as each asset's content key, so newly rendered
      # results are saved after an engine-only or renderer-only change.
      - name: Restore illustration caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/docs-figures
            .cache/docs-threejs
            .cache/docs-gallery
          key: docs-illustrations-v2-${{ hashFiles('src/tsdynamics/**', 'crates/**/src/**', 'crates/**/Cargo.toml', 'crates/Cargo.lock', 'docs/_tooling/**') }}
          restore-keys: |
            docs-illustrations-v2-
            docs-figures-

      - name: Restore field-movie cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/docs-field-movies
          key: docs-field-movies-v2-${{ hashFiles('src/tsdynamics/**', 'crates/**/src/**', 'crates/**/Cargo.toml', 'crates/Cargo.lock', 'docs/_tooling/**') }}
          restore-keys: |
            docs-field-movies-v2-
            docs-field-movies-

      - name: Sync project + docs + test deps and plotting extras
        run: uv sync --locked --group docs --group dev --all-extras --python 3.12

      - name: Execute documentation examples
        env:
          MPLBACKEND: Agg
        run: uv run --no-sync pytest tests/test_doctests.py --no-cov -q

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict

      # Official GitHub Actions Pages path (no gh-pages branch, one deploy hop) —
      # far more reliable than the legacy branch build. Pages source must be set to
      # "GitHub Actions" (build_type: workflow) in the repo settings.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # GitHub's Pages sync backend intermittently returns "Deployment failed, try
      # again later" during syncing_files even while Pages reports operational — it
      # is answered by simply re-deploying the same artifact. Absorb one such
      # transient automatically so a green build always ships instead of needing a
      # manual re-run. If both attempts fail, GitHub Pages is genuinely down and the
      # job fails.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Deploy to GitHub Pages (retry once)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
