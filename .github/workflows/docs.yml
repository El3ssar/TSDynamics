# Documentation: build on every PR and push to main (validation),
# deploy to GitHub Pages only on push to main.
#
# System figures (and the Gray-Scott / Swift-Hohenberg animated field-movie
# heroes) are rendered at build time by hooks/docs_autogen.py with on-disk caches
# (.cache/docs-figures, .cache/docs-field-movies) keyed by class-source hashes,
# restored via actions/cache so only new/changed systems re-render.  The field
# movies encode an mp4 via ffmpeg (installed below).

name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Only validate docs when something doc-relevant changes; an out-of-scope PR
    # would otherwise recompile the Rust engine (uv sync + maturin) for nothing.
    # The push-to-main trigger above stays unscoped so deploys always run.
    paths:
      - "docs/**"
      - "src/tsdynamics/**"
      - "mkdocs.yml"
      - "hooks/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # Silence Material for MkDocs' unconditional "MkDocs 2.0" marketing banner
  # (env-var suppression added in mkdocs-material 9.7.2).
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # The docs import `tsdynamics` (autogen pages, figures), so the build needs
      # the compiled engine; `uv sync` builds it via maturin (needs Rust).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The spatial-field systems (Gray-Scott / Swift-Hohenberg) render an animated
      # field-movie hero (docs/_tooling/field_movies.py) as an H.264 mp4 via
      # matplotlib's ffmpeg writer.  ffmpeg is not preinstalled on ubuntu-latest, so
      # install it; a cache hit (below) skips the render entirely, and a cache miss
      # without ffmpeg would fall back to a (larger) pillow GIF, so this keeps the
      # hero a small mp4.
      - name: Install ffmpeg (field-movie encoder)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Restore the figure + field-movie caches (both content-addressed by class
      # source + tooling), so only new/changed systems ever re-render.
      - name: Restore figure cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/docs-figures
          key: docs-figures-${{ hashFiles('src/tsdynamics/systems/**', 'docs/_tooling/**') }}
          restore-keys: |
            docs-figures-

      - name: Restore field-movie cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/docs-field-movies
          key: docs-field-movies-${{ hashFiles('src/tsdynamics/systems/**', 'docs/_tooling/field_movies.py') }}
          restore-keys: |
            docs-field-movies-

      - name: Sync project + docs deps
        run: uv sync --group docs

      - name: Build documentation
        run: uv run mkdocs build --strict

      # Official GitHub Actions Pages path (no gh-pages branch, one deploy hop) —
      # far more reliable than the legacy branch build. Pages source must be set to
      # "GitHub Actions" (build_type: workflow) in the repo settings.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # GitHub's Pages sync backend intermittently returns "Deployment failed, try
      # again later" during syncing_files even while Pages reports operational — it
      # is answered by simply re-deploying the same artifact. Absorb one such
      # transient automatically so a green build always ships instead of needing a
      # manual re-run. If both attempts fail, GitHub Pages is genuinely down and the
      # job fails.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy to GitHub Pages (retry once)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
