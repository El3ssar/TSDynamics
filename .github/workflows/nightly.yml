# Nightly exhaustive sweep: integrates EVERY built-in system on the Rust engine
# (pytest -m full). Too slow for PR CI.

name: Nightly full sweep

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

jobs:
  full-sweep:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    # Hard cap so a pathological system fails the run in minutes instead of
    # hanging for the full 6-hour GitHub Actions ceiling.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The engine is the sole integration backend, so the sweep needs the
      # compiled `tsdynamics._rust`; `uv sync` builds it via maturin (needs Rust).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install ffmpeg (documentation video exports)
        run: |
          # Match the docs build's transfer timeouts and retry policy.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg

      # The full tier executes the composition and animation documentation,
      # including SVG/GIF/MP4 exports. Exercise those examples with their extras
      # and the video encoder installed above.
      - name: Sync project + dev deps + plotting extras (builds the engine)
        run: uv sync --locked --group dev --all-extras --python 3.12

      - name: Full sweep
        run: uv run --no-sync pytest -m full --no-cov -q
